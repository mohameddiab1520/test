apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-service
  namespace: unity-collab
  labels:
    app: build-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: build-service
  template:
    metadata:
      labels:
        app: build-service
        component: backend
    spec:
      containers:
      - name: build-service
        image: collab/build-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8087
          name: http
        env:
        - name: PORT
          value: "8087"
        - name: ENVIRONMENT
          value: "production"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: collab-config
              key: POSTGRES_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: collab-config
              key: POSTGRES_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: collab-config
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: collab-secrets
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: collab-secrets
              key: POSTGRES_PASSWORD
        - name: DB_SSLMODE
          value: "require"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: collab-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: collab-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: collab-secrets
              key: REDIS_PASSWORD
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: collab-config
              key: S3_ENDPOINT
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: collab-config
              key: S3_REGION
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: collab-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: collab-secrets
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          value: "unity-collab-builds"
        - name: S3_USE_SSL
          value: "true"
        - name: UNITY_PATH
          value: "/opt/unity/Editor/Unity"
        - name: WORKSPACE_DIR
          value: "/tmp/builds"
        - name: DEFAULT_UNITY_VERSION
          value: "2022.3.0f1"
        - name: MAX_CONCURRENT_BUILDS
          value: "2"
        - name: BUILD_TIMEOUT
          value: "3600"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: workspace
          mountPath: /tmp/builds
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: build-service
  namespace: unity-collab
  labels:
    app: build-service
spec:
  selector:
    app: build-service
  ports:
  - port: 8087
    targetPort: 8087
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: build-service-hpa
  namespace: unity-collab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: build-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
