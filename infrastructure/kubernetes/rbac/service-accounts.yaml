apiVersion: v1
kind: ServiceAccount
metadata:
  name: unity-collab-sa
  namespace: unity-collab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unity-collab-role
  namespace: unity-collab
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unity-collab-rolebinding
  namespace: unity-collab
subjects:
  - kind: ServiceAccount
    name: unity-collab-sa
    namespace: unity-collab
roleRef:
  kind: Role
  name: unity-collab-role
  apiGroup: rbac.authorization.k8s.io
