# NOTE: This is a template. In production, use sealed-secrets or external secret management
apiVersion: v1
kind: Secret
metadata:
  name: collab-secrets
  namespace: unity-collab
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "collab_user"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  MONGODB_USER: "collab_user"
  MONGODB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  RABBITMQ_USER: "collab_user"
  RABBITMQ_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # JWT Secret (generate with: openssl rand -base64 32)
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"

  # S3/MinIO Credentials
  S3_ACCESS_KEY: "CHANGE_ME_IN_PRODUCTION"
  S3_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"

  # OAuth Secrets (if using)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
