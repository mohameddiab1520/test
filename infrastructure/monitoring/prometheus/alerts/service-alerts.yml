groups:
  - name: service_alerts
    interval: 30s
    rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "{{ $labels.app }} has error rate above 5% (current: {{ $value | humanizePercentage }})"

      # Service Down
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"

      # High Latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "{{ $labels.app }} P95 latency is above 500ms (current: {{ $value }}s)"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "{{ $labels.pod }} memory usage is above 90%"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          rate(container_cpu_usage_seconds_total[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "{{ $labels.pod }} CPU usage is above 90%"

      # Database Connection Pool Exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          postgres_connections_active > 180
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near capacity"
          description: "PostgreSQL has {{ $value }} active connections (limit: 200)"

      # Low Disk Space
      - alert: LowDiskSpace
        expr: |
          (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk usage is above 85% on {{ $labels.device }}"

      # High WebSocket Connection Count
      - alert: HighWebSocketConnections
        expr: |
          websocket_connections_active > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket connections"
          description: "WebSocket connections are above 5000 (current: {{ $value }})"

      # Sync Service High Operation Latency
      - alert: SyncServiceHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(sync_operation_latency_ms_bucket[5m])
          ) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sync service high latency"
          description: "Sync operation P95 latency is above 100ms (current: {{ $value }}ms)"

      # Voice Service Packet Loss
      - alert: VoiceServicePacketLoss
        expr: |
          rate(voice_audio_packets_lost_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Voice service packet loss"
          description: "Packet loss rate is above 5% (current: {{ $value | humanizePercentage }})"
