global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'unity-collab'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kubernetes pods with prometheus.io/scrape annotation
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      # Only scrape pods with prometheus.io/scrape=true annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      # Get scrape port from annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      # Get metrics path from annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Add pod metadata as labels
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod_name
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

  # Auth Service
  - job_name: 'auth-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: auth-service
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8083

  # Session Service
  - job_name: 'session-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: session-service
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8080

  # Asset Service
  - job_name: 'asset-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: asset-service
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8082

  # Sync Service
  - job_name: 'sync-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: sync-service
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8081

  # Analytics Service
  - job_name: 'analytics-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: analytics-service
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8084

  # Presence Service
  - job_name: 'presence-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: presence-service
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8085

  # Voice Service
  - job_name: 'voice-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - unity-collab
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: voice-service
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8086

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Node Exporter (for host metrics)
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):10250'
        replacement: '${1}:9100'
        target_label: __address__

  # kube-state-metrics
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics:8080']
