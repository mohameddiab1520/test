# NOTE: This is for development only. In production, use external secret management
# like AWS Secrets Manager, HashiCorp Vault, or Sealed Secrets
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unity-collab.fullname" . }}-secrets
  labels:
    {{- include "unity-collab.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "{{ .Values.postgresql.config.username }}"
  POSTGRES_PASSWORD: "{{ .Values.secrets.postgresql.password }}"
  REDIS_PASSWORD: "{{ .Values.secrets.redis.password }}"

  # JWT Secrets
  JWT_SECRET: "{{ .Values.secrets.jwt.secret }}"
  JWT_REFRESH_SECRET: "{{ .Values.secrets.jwt.refreshSecret }}"

  # S3 Credentials
  S3_ACCESS_KEY: "{{ .Values.secrets.s3.accessKey }}"
  S3_SECRET_KEY: "{{ .Values.secrets.s3.secretKey }}"
