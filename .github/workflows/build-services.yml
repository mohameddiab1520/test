name: Build and Push Services

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'gateway/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, session, asset, presence, build, conflict]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build ${{ matrix.service }} service
        run: |
          cd services/${{ matrix.service }}
          go build -v ./cmd/server

      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          go test -v ./...

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  build-node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [sync, voice, gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service == 'gateway' && 'gateway' || format('services/{0}', matrix.service) }}
          npm ci

      - name: Build
        run: |
          cd ${{ matrix.service == 'gateway' && 'gateway' || format('services/{0}', matrix.service) }}
          npm run build

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service == 'gateway' && 'gateway' || format('services/{0}', matrix.service) }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  build-python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
