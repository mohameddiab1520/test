name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_STAGING: unity-collab-staging
  EKS_CLUSTER_PROD: unity-collab-production

jobs:
  # Test jobs
  test-auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/auth/coverage.out
          flags: auth-service

  test-session-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/session
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.out

  test-analytics-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/analytics/coverage.xml
          flags: analytics-service

  test-presence-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/presence
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.out

  test-voice-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Build and push Docker images
  build-and-push:
    needs: [test-auth-service, test-session-service, test-analytics-service, test-presence-service, test-voice-service]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service: [auth, session, asset, sync, analytics, presence, voice]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service }}-service:$IMAGE_TAG services/${{ matrix.service }}
          docker tag $ECR_REGISTRY/${{ matrix.service }}-service:$IMAGE_TAG $ECR_REGISTRY/${{ matrix.service }}-service:latest
          docker push $ECR_REGISTRY/${{ matrix.service }}-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.service }}-service:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}-service:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy to staging
  deploy-staging:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-api.collab.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_STAGING }} --region ${{ env.AWS_REGION }}

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install unity-collab-staging ./infrastructure/helm/unity-collab \
            --namespace staging \
            --set image.tag=$IMAGE_TAG \
            --values infrastructure/helm/unity-collab/values-staging.yaml \
            --wait

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --image=curlimages/curl:latest \
            --restart=Never \
            --namespace=staging \
            --rm -i --tty -- sh -c '
              curl -f http://auth-service:8083/health &&
              curl -f http://session-service:8080/health &&
              curl -f http://analytics-service:8084/health &&
              curl -f http://presence-service:8085/health &&
              curl -f http://voice-service:8086/health
            '

  # Deploy to production
  deploy-production:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.collab.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_PROD }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production (Blue-Green)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install unity-collab-prod ./infrastructure/helm/unity-collab \
            --namespace production \
            --set image.tag=$IMAGE_TAG \
            --values infrastructure/helm/unity-collab/values-production.yaml \
            --wait

      - name: Health check
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=auth-service \
            --namespace=production \
            --timeout=300s

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Deployment to production completed successfully! 🚀",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment successful*\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref }}"
                  }
                }
              ]
            }
