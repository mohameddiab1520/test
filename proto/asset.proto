syntax = "proto3";

package collab.asset;

import "common.proto";

option go_package = "github.com/yourorg/collab/proto/asset";

// Asset Service
service AssetService {
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);
  rpc UploadAsset(stream UploadAssetRequest) returns (UploadAssetResponse);
  rpc DownloadAsset(DownloadAssetRequest) returns (stream DownloadAssetResponse);
  rpc CreateVersion(CreateVersionRequest) returns (CreateVersionResponse);
  rpc GetVersions(GetVersionsRequest) returns (GetVersionsResponse);
  rpc GetAssetMetadata(GetAssetMetadataRequest) returns (GetAssetMetadataResponse);
}

message Asset {
  string id = 1;
  string name = 2;
  string project_id = 3;
  string owner_id = 4;
  AssetType type = 5;
  int64 size = 6;
  string mime_type = 7;
  string storage_path = 8;
  string thumbnail_url = 9;
  int32 version = 10;
  AssetStatus status = 11;
  common.Timestamp created_at = 12;
  common.Timestamp updated_at = 13;
  common.Metadata metadata = 14;
}

enum AssetType {
  ASSET_TYPE_UNKNOWN = 0;
  ASSET_TYPE_TEXTURE = 1;
  ASSET_TYPE_MODEL = 2;
  ASSET_TYPE_AUDIO = 3;
  ASSET_TYPE_VIDEO = 4;
  ASSET_TYPE_SCRIPT = 5;
  ASSET_TYPE_SCENE = 6;
  ASSET_TYPE_PREFAB = 7;
  ASSET_TYPE_ANIMATION = 8;
  ASSET_TYPE_MATERIAL = 9;
  ASSET_TYPE_SHADER = 10;
  ASSET_TYPE_OTHER = 11;
}

enum AssetStatus {
  ASSET_STATUS_UNKNOWN = 0;
  ASSET_STATUS_UPLOADING = 1;
  ASSET_STATUS_PROCESSING = 2;
  ASSET_STATUS_READY = 3;
  ASSET_STATUS_FAILED = 4;
  ASSET_STATUS_DELETED = 5;
}

message AssetVersion {
  string id = 1;
  string asset_id = 2;
  int32 version = 3;
  string user_id = 4;
  string storage_path = 5;
  int64 size = 6;
  string change_description = 7;
  common.Timestamp created_at = 8;
}

message CreateAssetRequest {
  string name = 1;
  string project_id = 2;
  AssetType type = 3;
  string mime_type = 4;
  common.Metadata metadata = 5;
}

message CreateAssetResponse {
  Asset asset = 1;
  string upload_url = 2;
}

message GetAssetRequest {
  string asset_id = 1;
}

message GetAssetResponse {
  Asset asset = 1;
}

message ListAssetsRequest {
  string project_id = 1;
  AssetType type = 2;
  string search_query = 3;
  common.PaginationRequest pagination = 4;
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  common.PaginationResponse pagination = 2;
}

message UpdateAssetRequest {
  string asset_id = 1;
  string name = 2;
  AssetStatus status = 3;
  common.Metadata metadata = 4;
}

message UpdateAssetResponse {
  Asset asset = 1;
}

message DeleteAssetRequest {
  string asset_id = 1;
}

message DeleteAssetResponse {
  bool success = 1;
}

message UploadAssetRequest {
  oneof data {
    AssetInfo info = 1;
    bytes chunk = 2;
  }
}

message AssetInfo {
  string asset_id = 1;
  string filename = 2;
  int64 total_size = 3;
}

message UploadAssetResponse {
  string asset_id = 1;
  int64 bytes_uploaded = 2;
  bool success = 3;
}

message DownloadAssetRequest {
  string asset_id = 1;
  int32 version = 2;
}

message DownloadAssetResponse {
  oneof data {
    AssetInfo info = 1;
    bytes chunk = 2;
  }
}

message CreateVersionRequest {
  string asset_id = 1;
  string change_description = 2;
}

message CreateVersionResponse {
  AssetVersion version = 1;
}

message GetVersionsRequest {
  string asset_id = 1;
}

message GetVersionsResponse {
  repeated AssetVersion versions = 1;
}

message GetAssetMetadataRequest {
  string asset_id = 1;
}

message GetAssetMetadataResponse {
  common.Metadata metadata = 1;
  map<string, string> tags = 2;
  repeated string dependencies = 3;
}
